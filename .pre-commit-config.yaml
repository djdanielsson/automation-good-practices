repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-adoc-examples
        name: Check AsciiDoc example conventions
        entry: python3 scripts/check-adoc-examples.py
        language: system
        pass_filenames: false
        files: \.adoc$
      - id: lint-yaml
        name: Lint Ansible YAML
        entry: bash scripts/lint-all-yaml.sh
        language: python
        additional_dependencies:
          - ansible-lint
        pass_filenames: false
        files: |
          (?x)^(
            \.ansible-lint|
            scripts/lint-yaml\.sh|
            scripts/lint-all-yaml\.sh|
            scripts/check-adoc-examples\.py|
            examples/|
            playbooks/|
            roles/|
            inventories/|
            .*\.(yml|yaml|adoc)
          )$
